services:
  openclaw-gateway:
    image: ghcr.io/${GHCR_USERNAME}/openclaw-docker-config/openclaw-gateway:latest
    env_file: .env
    restart: unless-stopped
    environment:
      HOME: /home/node
      NODE_ENV: production
      TERM: xterm-256color
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-0.0.0.0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/home/openclaw/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/home/openclaw/.openclaw/workspace}:/home/node/.openclaw/workspace
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    command: openclaw gateway --bind lan --port 18789

  template-runtime:
    image: ghcr.io/${GHCR_USERNAME}/openclaw-docker-config/openclaw-gateway:latest
    env_file: .env
    restart: unless-stopped
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      NODE_ENV: production
      INSTANCE_ID: ${INSTANCE_ID:-}
      INSTANCE_SLUG: ${INSTANCE_SLUG:-}
      TEMPLATE_SLUG: ${TEMPLATE_SLUG:-executive}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      RUNTIME_SYNC_TOKEN: ${RUNTIME_SYNC_TOKEN:-}
      CUSTOMER_TIMEZONE: ${CUSTOMER_TIMEZONE:-UTC}
      TEMPLATE_RUNTIME_PORT: ${TEMPLATE_RUNTIME_PORT:-3001}
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GWS_CONFIG_DIR: /home/node/.config/gws
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-/home/openclaw/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_GWS_CONFIG_DIR:-/home/openclaw/.config/gws}:/home/node/.config/gws
    depends_on:
      - openclaw-gateway
    command: node /opt/template-runtime/server.js

  # Caddy reverse proxy — auto-TLS for customer dashboard access
  # Shares network namespace with gateway so reverse_proxy goes to localhost.
  # This makes the gateway see connections from 127.0.0.1 (local).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:openclaw-gateway"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - openclaw-gateway
      - template-runtime

  workspace-sync:
    image: ghcr.io/${GHCR_USERNAME}/openclaw-docker-config/workspace-sync:latest
    restart: unless-stopped
    environment:
      GIT_WORKSPACE_REPO: ${GIT_WORKSPACE_REPO:-}
      GIT_WORKSPACE_BRANCH: ${GIT_WORKSPACE_BRANCH:-auto}
      GIT_WORKSPACE_TOKEN: ${GIT_WORKSPACE_TOKEN:-}
      GIT_WORKSPACE_SYNC_SCHEDULE: ${GIT_WORKSPACE_SYNC_SCHEDULE:-0 4 * * *}
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-/home/openclaw/.openclaw/workspace}:/workspace
    profiles:
      - sync

volumes:
  caddy_data:
  caddy_config:
